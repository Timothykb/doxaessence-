<section class="newsletter" aria-labelledby="newsletter-title">
  <div class="newsletter-inner">
    <p class="eyebrow">Nieuwsbrief</p>
    <h2 id="newsletter-title" class="display">Het volgende hoofdstuk <em>begint hier.</em></h2>
    <p class="newsletter-copy">Ontvang nieuws over The Genesis, verhalen achter onze geuren en updates van Doxa Essence.</p>
    <form class="newsletter-form" data-newsletter novalidate>
      <div class="field">
        <label for="nl-name">Voornaam</label>
        <input id="nl-name" type="text" name="first_name" autocomplete="given-name" required maxlength="100" aria-describedby="nl-status">
      </div>
      <div class="field">
        <label for="nl-email">E-mailadres</label>
        <input id="nl-email" type="email" name="email" autocomplete="email" required maxlength="254" placeholder="naam@voorbeeld.nl" aria-describedby="nl-help nl-status">
      </div>
      <label class="check"><input type="checkbox" name="consent" required><span>Ja, ik wil de nieuwsbrief van Doxa Essence per e-mail ontvangen. Dit staat los van een bestelling.</span></label>
      <div class="honey" aria-hidden="true"><label>Laat dit veld leeg <input name="company" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn" type="submit"><span class="btn-label">Houd mij op de hoogte</span></button>
      <p class="form-help" id="nl-help">Je ontvangt een welkomstmail. Afmelden kan altijd via de afmeldlink in elke e-mail.</p>
      <p class="form-status" id="nl-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
